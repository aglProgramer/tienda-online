<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Acceso Premium Tech - TechCore</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-[#050505] font-sans text-white min-h-screen selection:bg-[#00f2ff] selection:text-black">
    <header class="flex items-center justify-between px-12 py-8 sticky top-0 z-50 bg-[#050505]/80 backdrop-blur-sm">
        <div class="flex items-center gap-3">
            <div class="size-6 border border-white/20 flex items-center justify-center">
                <div class="size-1.5 bg-[#00f2ff]"></div>
            </div>
            <h2 class="text-white text-sm font-light tracking-[0.3em] uppercase">TechCore</h2>
        </div>
        <div class="flex items-center gap-8">
            <a href="registro.html"
                class="text-[10px] tracking-widest uppercase border border-white/20 px-6 py-2 hover:bg-white hover:text-black transition-all">
                Join Nexus
            </a>
        </div>
    </header>

    <main class="flex flex-col items-center justify-center min-h-[calc(100vh-180px)] px-6 relative">
        <div class="absolute inset-0 overflow-hidden pointer-events-none opacity-20">
            <div class="absolute top-0 left-1/2 -translate-x-1/2 w-px h-full bg-white/5"></div>
            <div class="absolute top-1/2 left-0 -translate-y-1/2 w-full h-px bg-white/5"></div>
        </div>

        <div class="w-full max-w-[440px] relative z-10">
            <div class="mb-16 flex flex-col items-center">
                <div class="relative border border-white/10 p-4 mb-8">
                    <span class="material-symbols-outlined text-[#00f2ff] text-5xl font-extralight">qr_code_2</span>
                    <div class="absolute top-0 left-0 w-2 h-2 border-t border-l border-[#00f2ff]"></div>
                    <div class="absolute top-0 right-0 w-2 h-2 border-t border-r border-[#00f2ff]"></div>
                    <div class="absolute bottom-0 left-0 w-2 h-2 border-b border-l border-[#00f2ff]"></div>
                    <div class="absolute bottom-0 right-0 w-2 h-2 border-b border-r border-[#00f2ff]"></div>
                </div>
                <h1 class="text-3xl font-extralight tracking-tight mb-3">Identification Required</h1>
                <p class="text-white/40 text-xs tracking-widest uppercase">Secure node access</p>
            </div>

            <form class="space-y-10">
                <div class="space-y-8">
                    <div class="group relative">
                        <label
                            class="absolute -top-6 left-0 text-[10px] tracking-[0.2em] uppercase text-white/30 group-focus-within:text-[#00f2ff]">Digital
                            Identity</label>
                        <div
                            class="flex items-center border-b border-white/10 group-focus-within:border-[#00f2ff] transition-all duration-500">
                            <span
                                class="material-symbols-outlined text-white/20 group-focus-within:text-[#00f2ff] mr-4 text-lg">alternate_email</span>
                            <input
                                class="w-full py-4 bg-transparent border-none focus:ring-0 text-sm tracking-wide placeholder:text-white/10"
                                placeholder="USER_ID@SECURE.SYS" type="email" />
                        </div>
                    </div>
                    <div class="group relative">
                        <div class="absolute -top-6 left-0 right-0 flex justify-between items-center">
                            <label
                                class="text-[10px] tracking-[0.2em] uppercase text-white/30 group-focus-within:text-[#00f2ff]">Access
                                Key</label>
                            <a class="text-[9px] tracking-[0.1em] uppercase text-white/20 hover:text-[#00f2ff]"
                                href="#">Recovery</a>
                        </div>
                        <div
                            class="flex items-center border-b border-white/10 group-focus-within:border-[#00f2ff] transition-all duration-500">
                            <span
                                class="material-symbols-outlined text-white/20 group-focus-within:text-[#00f2ff] mr-4 text-lg">shield_lock</span>
                            <input
                                class="w-full py-4 bg-transparent border-none focus:ring-0 text-sm tracking-wide placeholder:text-white/10"
                                placeholder="••••••••" type="password" />
                        </div>
                    </div>
                </div>
                <button
                    class="w-full group relative overflow-hidden bg-white text-black py-5 text-xs font-bold tracking-[0.3em] uppercase transition-all hover:bg-[#00f2ff] hover:tracking-[0.4em]"
                    type="submit">
                    Initialize Session
                </button>
            </form>

            <div class="mt-16 flex flex-col items-center gap-8">
                <p class="text-center text-white/30 text-[10px] tracking-widest uppercase">
                    New user?
                    <a class="text-white hover:text-[#00f2ff] font-bold ml-2 underline" href="registro.html">Create
                        Credentials</a>
                </p>
            </div>
        </div>
    </main>

    <footer class="mt-20 px-12 py-12 border-t border-white/5 relative bg-[#050505]">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-8">
            <p class="text-white/20 text-[9px] tracking-[0.2em] uppercase">© 2024 TechCore Systems Engineering</p>
            <div class="flex gap-12">
                <a class="text-white/20 hover:text-[#00f2ff] transition-colors text-[9px] uppercase tracking-widest"
                    href="index.html">Main Catalog</a>
                <a class="text-white/20 hover:text-[#00f2ff] transition-colors text-[9px] uppercase tracking-widest"
                    href="#">Privacy Protocol</a>
            </div>
        </div>
    </footer>
</body>

</html>
