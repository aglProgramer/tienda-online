<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Acceso Premium Tech - TechCore</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1',
                        secondary: '#06b6d4',
                        navy: '#020617',
                        'deep-slate': '#0f172a',
                    }
                }
            }
        }
    </script>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300..800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-[#020617] font-sans text-slate-100 overflow-x-hidden min-h-screen">
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="abstract-shape w-[500px] h-[500px] bg-indigo-600/20 rounded-full -top-48 -left-24 blur-3xl"></div>
        <div class="abstract-shape w-[600px] h-[600px] bg-cyan-500/10 rounded-full -bottom-48 -right-24 blur-3xl"></div>
        <div
            class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')] opacity-5">
        </div>
    </div>

    <div class="relative flex min-h-screen w-full flex-col z-10">
        <header class="flex items-center justify-between px-8 py-6 bg-transparent">
            <a href="index.html" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
                <div
                    class="size-10 bg-gradient-to-br from-indigo-500 to-cyan-400 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-500/20">
                    <span class="material-symbols-outlined text-white font-bold">deployed_code</span>
                </div>
                <h2 class="text-white text-2xl font-black tracking-tighter">NEXUS</h2>
            </a>
            <a href="registro.html"
                class="px-5 py-2 rounded-full border border-slate-700 text-sm font-semibold hover:bg-slate-800 transition-all font-mono tracking-tighter">
                REGISTRAR_NODO
            </a>
        </header>

        <main class="flex-1 flex items-center justify-center p-4">
            <div class="w-full max-w-[480px] glass-panel p-8 md:p-12 rounded-[2.5rem] relative overflow-hidden">
                <div class="flex flex-col gap-3 text-center mb-10">
                    <h1
                        class="text-white text-4xl font-black tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400 uppercase">
                        Acceso de Operador
                    </h1>
                    <p class="text-slate-400 text-sm font-medium tracking-widest uppercase">Sincroniza tu identidad
                        digital</p>
                </div>

                <form id="login-form" class="flex flex-col gap-8">
                    <div class="flex flex-col gap-2">
                        <label class="text-slate-300 text-xs font-bold uppercase tracking-[0.3em] ml-1">Correo
                            Electrónico (Usuario)</label>
                        <div class="group relative">
                            <span
                                class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-indigo-400">alternate_email</span>
                            <input id="login-email" required
                                class="w-full bg-slate-900/50 border border-slate-700/50 rounded-2xl h-14 pl-12 pr-4 text-white focus:outline-none focus:ring-1 focus:ring-[#00f2ff]/50 transition-all font-mono text-sm"
                                placeholder="usuario@ejemplo.com" type="email" />
                        </div>
                    </div>

                    <div class="flex flex-col gap-2">
                        <label class="text-slate-300 text-xs font-bold uppercase tracking-[0.3em] ml-1">Documento de
                            Identidad (Contraseña)</label>
                        <div class="group relative">
                            <span
                                class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-indigo-400">shield_lock</span>
                            <input id="login-document" required
                                class="w-full bg-slate-900/50 border border-slate-700/50 rounded-2xl h-14 pl-12 pr-4 text-white focus:outline-none focus:ring-1 focus:ring-[#00f2ff]/50 transition-all font-mono text-sm"
                                placeholder="Ingresa tu DNI / ID" type="password" />
                        </div>
                    </div>

                    <button id="login-btn"
                        class="neon-pulse w-full bg-indigo-600 text-white h-14 rounded-2xl text-base font-black uppercase tracking-[0.2em] hover:bg-indigo-500 hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-2 group shadow-xl shadow-indigo-600/30"
                        type="submit">
                        INICIALIZAR SESIÓN
                        <span
                            class="material-symbols-outlined text-xl group-hover:translate-x-1 transition-transform">login</span>
                    </button>
                </form>

                <div id="login-status" class="hidden mt-6 p-4 rounded-xl border border-white/10 glass text-center">
                    <p class="text-xs font-bold uppercase tracking-widest"></p>
                </div>

                <div class="mt-10 pt-8 border-t border-slate-800/50 text-center">
                    <p class="text-slate-500 text-xs font-bold tracking-widest uppercase">
                        ¿Nueva identidad?
                        <a class="text-[#00f2ff] hover:text-white ml-2 transition-colors underline"
                            href="registro.html">
                            Crear Credenciales
                        </a>
                    </p>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="js/login-v2.js"></script>
</body>

</html>
