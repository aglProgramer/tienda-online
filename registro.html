<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Registro Vanguardista - Futuro</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200..800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-[#020617] font-sans text-slate-100 overflow-x-hidden min-h-screen">
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="abstract-shape w-[500px] h-[500px] bg-[#00f2ff] rounded-full -top-48 -left-24"></div>
        <div class="abstract-shape w-[600px] h-[600px] bg-[#7000ff] rounded-full -bottom-48 -right-24"></div>
        <div
            class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')] opacity-10">
        </div>
    </div>

    <div class="relative flex min-h-screen w-full flex-col z-10">
        <header class="flex items-center justify-between px-8 py-6 bg-transparent">
            <a href="index.html" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
                <div
                    class="size-10 bg-gradient-to-br from-[#00f2ff] to-[#7000ff] rounded-xl flex items-center justify-center">
                    <span class="material-symbols-outlined text-black font-bold">rocket_launch</span>
                </div>
                <h2 class="text-white text-2xl font-extrabold tracking-tighter">VANGUARD</h2>
            </a>
            <a href="login.html"
                class="px-5 py-2 rounded-full border border-slate-700 text-sm font-semibold hover:bg-slate-800 transition-all">
                Autenticarse
            </a>
        </header>

        <main class="flex-1 flex items-center justify-center p-4 md:p-12">
            <div class="w-full max-w-[520px] glass-panel p-8 md:p-12 rounded-[2.5rem] relative overflow-hidden">
                <div class="flex flex-col gap-3 text-center mb-10">
                    <h1
                        class="text-white text-4xl font-black tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400">
                        Únete a la Vanguardia
                    </h1>
                    <p class="text-slate-400 text-lg font-light">Crea tu identidad digital para el próximo nivel.</p>
                </div>

                <form id="registration-form" class="flex flex-col gap-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="flex flex-col gap-2">
                            <label
                                class="text-slate-300 text-xs font-bold uppercase tracking-widest ml-1">Nombres</label>
                            <div class="group relative">
                                <span
                                    class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-[#00f2ff]">person</span>
                                <input id="reg-name" required
                                    class="w-full bg-slate-900/50 border border-slate-700/50 rounded-2xl h-14 pl-12 pr-4 text-white focus:outline-none focus:ring-1 focus:ring-[#00f2ff]/50 transition-all font-mono text-sm"
                                    placeholder="ID_ALPHA" type="text" />
                            </div>
                        </div>
                        <div class="flex flex-col gap-2">
                            <label
                                class="text-slate-300 text-xs font-bold uppercase tracking-widest ml-1">Apellidos</label>
                            <div class="group relative">
                                <span
                                    class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-[#00f2ff]">person</span>
                                <input id="reg-lastname" required
                                    class="w-full bg-slate-900/50 border border-slate-700/50 rounded-2xl h-14 pl-12 pr-4 text-white focus:outline-none focus:ring-1 focus:ring-[#00f2ff]/50 transition-all font-mono text-sm"
                                    placeholder="SUBORDINATE_NAME" type="text" />
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="flex flex-col gap-2">
                            <label class="text-slate-300 text-xs font-bold uppercase tracking-widest ml-1">Email</label>
                            <div class="group relative">
                                <span
                                    class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-[#00f2ff]">alternate_email</span>
                                <input id="reg-email" required
                                    class="w-full bg-slate-900/50 border border-slate-700/50 rounded-2xl h-14 pl-12 pr-4 text-white focus:outline-none focus:ring-1 focus:ring-[#00f2ff]/50 transition-all font-mono text-sm"
                                    placeholder="COMM_LINK@SECURE.SYS" type="email" />
                            </div>
                        </div>
                        <div class="flex flex-col gap-2">
                            <label class="text-slate-300 text-xs font-bold uppercase tracking-widest ml-1">Documento
                                (DNI/ID)</label>
                            <div class="group relative">
                                <span
                                    class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-[#00f2ff]">badge</span>
                                <input id="reg-document" required
                                    class="w-full bg-slate-900/50 border border-slate-700/50 rounded-2xl h-14 pl-12 pr-4 text-white focus:outline-none focus:ring-1 focus:ring-[#00f2ff]/50 transition-all font-mono text-sm"
                                    placeholder="ID_NUM_000" type="text" />
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="flex flex-col gap-2">
                            <label
                                class="text-slate-300 text-xs font-bold uppercase tracking-widest ml-1">Teléfono</label>
                            <div class="group relative">
                                <span
                                    class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-[#00f2ff]">call</span>
                                <input id="reg-phone" required
                                    class="w-full bg-slate-900/50 border border-slate-700/50 rounded-2xl h-14 pl-12 pr-4 text-white focus:outline-none focus:ring-1 focus:ring-[#00f2ff]/50 transition-all font-mono text-sm"
                                    placeholder="+00 000 0000" type="tel" />
                            </div>
                        </div>
                        <div class="flex flex-col gap-2">
                            <label class="text-slate-300 text-xs font-bold uppercase tracking-widest ml-1">Dirección
                                Física</label>
                            <div class="group relative">
                                <span
                                    class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-[#00f2ff]">location_on</span>
                                <input id="reg-address" required
                                    class="w-full bg-slate-900/50 border border-slate-700/50 rounded-2xl h-14 pl-12 pr-4 text-white focus:outline-none focus:ring-1 focus:ring-[#00f2ff]/50 transition-all font-mono text-sm"
                                    placeholder="GRID_COORDINATES" type="text" />
                            </div>
                        </div>
                    </div>

                    <button id="reg-submit-btn"
                        class="neon-pulse w-full bg-[#00f2ff] text-[#020617] h-14 rounded-2xl text-base font-black uppercase tracking-[0.2em] hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-2 group"
                        type="submit">
                        Inicializar Registro
                        <span
                            class="material-symbols-outlined text-xl group-hover:translate-x-1 transition-transform">arrow_forward</span>
                    </button>
                </form>

                <div id="reg-status" class="hidden mt-6 p-4 rounded-xl border border-white/10 glass text-center">
                    <p id="reg-status-text" class="text-xs font-bold uppercase tracking-widest text-[#00f2ff]"></p>
                </div>

                <div class="mt-10 pt-8 border-t border-slate-800/50 text-center">
                    <p class="text-slate-500 text-sm font-medium">
                        ¿Ya formas parte del sistema?
                        <a class="text-[#00f2ff] font-bold hover:text-white ml-2 transition-colors" href="login.html">
                            Autenticarse
                        </a>
                    </p>
                </div>
            </div>
        </main>
    </div>
    <script type="module" src="js/registro.js"></script>
</body>

</html>
