<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Módulo de Transacción - NEXUS</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200..800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="min-h-screen text-slate-200 selection:bg-primary/30 bg-[#0f172a]">
    <div class="relative flex min-h-screen w-full flex-col">
        <header class="sticky top-0 z-50 glass px-6 lg:px-12 py-4">
            <div class="flex items-center justify-between max-w-7xl mx-auto">
                <div class="flex items-center gap-3">
                    <div
                        class="size-10 bg-gradient-to-br from-[#00f2ff] to-[#7000ff] rounded-xl flex items-center justify-center shadow-lg shadow-primary/20">
                        <span class="material-symbols-outlined text-white font-bold">hub</span>
                    </div>
                    <h1 class="text-white text-xl font-bold tracking-tight">DIGITAL<span
                            class="text-[#00f2ff]">HUB</span></h1>
                </div>
                <nav class="hidden md:flex items-center gap-8">
                    <a class="text-xs font-bold uppercase tracking-widest text-slate-400 hover:text-[#00f2ff]"
                        href="index.html">Catálogo</a>
                    <a class="text-xs font-bold uppercase tracking-widest text-[#00f2ff] border-b-2 border-[#00f2ff] pb-1"
                        href="#">Carrito</a>
                </nav>
            </div>
        </header>

        <main class="flex-1 max-w-7xl mx-auto w-full px-6 lg:px-12 py-12">
            <div class="flex flex-col md:flex-row md:items-end justify-between mb-12 gap-6">
                <div>
                    <div class="flex items-center gap-2 text-primary text-xs font-bold uppercase tracking-[0.2em] mb-3">
                        <span class="size-2 rounded-full bg-primary animate-pulse"></span>
                        Sesión de Compra Activa
                    </div>
                    <h2 class="text-5xl font-extrabold text-white tracking-tight">Módulo de <span
                            class="text-transparent bg-clip-text bg-gradient-to-r from-[#00f2ff] to-[#7000ff]">Transacción</span>
                    </h2>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
                <div class="lg:col-span-8 space-y-6" id="cart-items-container">
                    <!-- Items will be injected here -->
                </div>

                <div class="lg:col-span-4">
                    <div class="glass sticky top-32 rounded-[2.5rem] p-8 border-primary/20 shadow-2xl">
                        <h3 class="text-lg font-black text-white uppercase tracking-widest mb-10">Resumen de Datos</h3>
                        <div class="space-y-6 mb-10">
                            <div class="flex justify-between items-center">
                                <span class="text-slate-400 text-sm font-medium">Subtotal</span>
                                <span class="text-white font-bold" id="cart-subtotal">$0.00</span>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-slate-400 text-sm font-medium">Impuesto Operativo (15%)</span>
                                <span class="text-white font-bold" id="cart-tax">$0.00</span>
                            </div>
                        </div>
                        <div class="pt-8 border-t border-white/5 mb-10">
                            <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1">Total a
                                Transferir</p>
                            <p class="text-5xl font-black text-white tabular-nums tracking-tighter" id="cart-total">
                                $0.00</p>
                        </div>

                        <!-- User Info Form for Checkout -->
                        <div class="space-y-4 mb-8">
                            <div class="grid grid-cols-2 gap-4">
                                <input type="text" id="client-name" placeholder="NOMBRES"
                                    class="bg-navy/50 border border-white/10 rounded-xl px-4 py-3 text-xs tracking-widest focus:ring-1 focus:ring-primary outline-none text-white">
                                <input type="text" id="client-last" placeholder="APELLIDOS"
                                    class="bg-navy/50 border border-white/10 rounded-xl px-4 py-3 text-xs tracking-widest focus:ring-1 focus:ring-primary outline-none text-white">
                            </div>
                            <input type="email" id="client-email" placeholder="EMAIL"
                                class="w-full bg-navy/50 border border-white/10 rounded-xl px-4 py-3 text-xs tracking-widest focus:ring-1 focus:ring-primary outline-none text-white">
                            <input type="tel" id="client-phone" placeholder="TELÉFONO"
                                class="w-full bg-navy/50 border border-white/10 rounded-xl px-4 py-3 text-xs tracking-widest focus:ring-1 focus:ring-primary outline-none text-white">
                            <input type="text" id="client-address" placeholder="DIRECCIÓN"
                                class="w-full bg-navy/50 border border-white/10 rounded-xl px-4 py-3 text-xs tracking-widest focus:ring-1 focus:ring-primary outline-none text-white">
                        </div>

                        <button id="checkout-btn"
                            class="w-full py-5 bg-gradient-to-r from-[#00f2ff] to-[#7000ff] text-white font-black rounded-2xl hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-3 group">
                            AUTORIZAR PAGO
                            <span
                                class="material-symbols-outlined group-hover:translate-x-1 transition-transform">bolt</span>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modals or Overlays can go here -->
    <div id="checkout-status"
        class="fixed inset-0 bg-navy/90 backdrop-blur-xl z-[100] hidden flex items-center justify-center p-6 text-center">
        <div class="max-w-md">
            <div id="status-icon"
                class="size-20 bg-primary/20 rounded-full flex items-center justify-center mx-auto mb-8">
                <span class="material-symbols-outlined text-primary text-4xl animate-pulse">sync</span>
            </div>
            <h2 id="status-title" class="text-3xl font-black text-white uppercase tracking-tighter mb-4">Procesando
                Protocolo</h2>
            <p id="status-msg" class="text-slate-400 text-sm tracking-widest mb-8">Sincronizando con la red de Nexus...
            </p>
            <button id="status-close"
                class="hidden px-8 py-3 border border-primary text-primary text-[10px] font-bold uppercase tracking-widest rounded-xl">Regresar
                al Nexo</button>
        </div>
    </div>

    <script type="module" src="js/carrito.js"></script>
</body>

</html>
